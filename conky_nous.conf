-- Panel de consumo del Nous Portal (plan de ventana/día-semana-mes).
-- Render: nous_pie_gen.py (Pillow) + fetch_nous_stats.py (daemon, 5 min).
-- Lee el access_token OAuth de ~/.hermes/shared/nous_auth.json (nunca lo
-- refresca: eso lo hace Hermes en cada llamada API; ver daemon).
conky.config = {
    alignment = 'bottom_left',
    gap_x = 3120,   -- absoluto: columna del monitor derecho
    gap_y = 10,
    minimum_width  = 350,
    maximum_width  = 350,
    minimum_height = 239,
    update_interval = 3,

    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    double_buffer = true,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    override_utf8_locale = true,

    default_color = 'e0e0e0',
    color1 = '5eb8ff',
    color2 = '5af78e',
    color3 = 'ff6e6e',
    color4 = 'ffd700',
    color5 = 'ffb347',

    draw_shades = false,
    draw_outline = false,
    border_width = 0,
    no_buffers = true,
    short_units = true,
};

conky.text = [[
${color1}${font DejaVu Sans Mono:bold:size=12}${alignc}◉ NOUS PORTAL ◉${font}${color}
${hr 1}
${execi 20 python3 /home/arkantu/.config/conky/nous_pie_gen.py}${image /tmp/nous_pie.png -p 0,25 -s 350x204 -n}
]];
