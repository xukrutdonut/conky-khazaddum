-- Panel de cuota de Ollama Cloud con datos reales de https://ollama.com/settings
-- (Ollama no expone la cuota por API: issue #12532). La cookie __Secure-session
-- se lee de Chrome y se descifra con la clave del keyring -> hace falta
-- ~/.venvs/conky-ollama con secretstorage + cryptography.
-- Render: ollama_quota_gen.py (Pillow) + ollama_cloud_usage.py (consulta, 1/min).
conky.config = {
    alignment = 'bottom_right',
    xinerama_head = 1,
    gap_x = 1090,
    gap_y = 10,
    minimum_width  = 350,
    maximum_width  = 350,
    minimum_height = 239,
    update_interval = 3,

    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    double_buffer = true,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    override_utf8_locale = true,

    default_color = 'e0e0e0',
    color1 = '5eb8ff',
    color2 = '5af78e',
    color3 = 'ff6e6e',
    color4 = 'ffd700',
    color5 = 'ffb347',

    draw_shades = false,
    draw_outline = false,
    border_width = 0,
    no_buffers = true,
    short_units = true,
};

conky.text = [[
${color1}${font DejaVu Sans Mono:bold:size=12}${alignc}◉ OLLAMA CLOUD ◉${font}${color}
${hr 1}
${execi 20 python3 /home/arkantu/.config/conky/ollama_quota_gen.py}${image /tmp/ollama_quota.png -p 0,25 -s 350x204 -n}
]];
