conky.config = {
    alignment = 'top_right',
    xinerama_head = 1,
    gap_x = 1450,
    gap_y = 10,
    minimum_width = 350,
    maximum_width = 350,
    update_interval = 3,

    -- Ventana
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    double_buffer = true,

    -- Fuente
    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    override_utf8_locale = true,

    -- Colores
    default_color = 'e0e0e0',
    color1 = '5eb8ff',   -- azul: etiquetas
    color2 = '5af78e',   -- verde: bueno/TX
    color3 = 'ff6e6e',   -- rojo: alerta
    color4 = 'ffd700',   -- dorado: sección
    color5 = 'ffb347',   -- naranja: valores medios

    draw_shades = false,
    draw_outline = false,
    border_width = 0,
    no_buffers = true,
    short_units = true,
};

conky.text = [[
${color4}${alignc}KHAZAD-DUM${color}
${color1}${alignc}${nodename} — ${kernel}${color}
${color1}${alignc}Up: ${uptime_short}${color}
${hr 1}
${color4}── CPU ──────────────────────────────────────────${color}
${color1}Uso: ${color2}${cpu cpu0}%${color}  ${color1}Freq: ${color2}${exec cat /sys/class/drm/card1/gt_cur_freq_mhz 2>/dev/null || echo 0}MHz${color}  ${color1}Temp: ${color3}${exec awk '{printf "%.0f°C",$1/1000; exit}' /sys/devices/platform/coretemp.0/hwmon/hwmon*/temp1_input /sys/class/thermal/thermal_zone1/temp 2>/dev/null || echo 0°C}${color}
${cpubar 4,344}
${cpugraph 20,344 5af78e ff6e6e}
${color1}Cores (1–8):${color}
${color2}${cpubar 3,80 cpu1}${color} ${color2}${cpubar 3,80 cpu2}${color} ${color2}${cpubar 3,80 cpu3}${color} ${color2}${cpubar 3,80 cpu4}${color}
${color2}${cpubar 3,80 cpu5}${color} ${color2}${cpubar 3,80 cpu6}${color} ${color2}${cpubar 3,80 cpu7}${color} ${color2}${cpubar 3,80 cpu8}${color}
${color1}Cores (9–16):${color}
${color2}${cpubar 3,80 cpu9}${color} ${color2}${cpubar 3,80 cpu10}${color} ${color2}${cpubar 3,80 cpu11}${color} ${color2}${cpubar 3,80 cpu12}${color}
${color2}${cpubar 3,80 cpu13}${color} ${color2}${cpubar 3,80 cpu14}${color} ${color2}${cpubar 3,80 cpu15}${color} ${color2}${cpubar 3,80 cpu16}${color}
${color4}── MEMORIA ──────────────────────────────────────${color}
${color1}RAM:  ${color2}${mem} / ${memmax}${color}  (${color5}${memperc}%${color})
${membar 4,344}
${color1}Swap: ${color5}${swap} / ${swapmax}${color}  (${color5}${swapperc}%${color})
${swapbar 3,344}
${color4}── ALMACENAMIENTO ───────────────────────────────${color}
${color1}nvme0n1: ${color2}${fs_used /} / ${fs_size /}${color}  (${color5}${fs_used_perc /}%${color})
${fs_bar 4,344 /}
${color1}Storage1TB: ${color2}${fs_used /media/arkantu/Storage1TB} / ${fs_size /media/arkantu/Storage1TB}${color}  (${color5}${fs_used_perc /media/arkantu/Storage1TB}%${color})
${fs_bar 4,344 /media/arkantu/Storage1TB}
${color1}NVMe temp: ${color3}${exec awk '{printf "%.0f°C",$1/1000}' /sys/class/hwmon/hwmon1/temp1_input 2>/dev/null || echo N/A}${color}
${color4}── DISCO I/O ─────────────────────────────────${color}
${color1}▼ R: ${color2}${diskio_read}${color}   ${color1}▲ W: ${color5}${diskio_write}${color}
${execgraph ~/.config/conky/khazad_diskioread.sh 20,170 5af78e ffb347} ${execgraph ~/.config/conky/khazad_diskiowrite.sh 20,170 ff6e6e ffb347}
${color4}── RED ─ enp173s0 ───────────────────────────────${color}
${color1}▼ RX: ${color2}${downspeed enp173s0}${color}   ${color1}▲ TX: ${color5}${upspeed enp173s0}${color}
${downspeedgraph enp173s0 20,170 5af78e ff6e6e} ${upspeedgraph enp173s0 20,170 5af78e ffb347}
${color1}Total: ▼${color2}${totaldown enp173s0}${color}  ▲${color5}${totalup enp173s0}${color}
${color4}── NPU ─ Intel AI Boost ─────────────────────────${color}
${color1}Uso: ${color2}${execi 3 ~/.config/conky/get_npu_val.sh BUSY}%${color}   ${color1}Freq: ${color2}${execi 3 ~/.config/conky/get_npu_val.sh FREQ} / ${execi 3 ~/.config/conky/get_npu_val.sh FREQ_MAX} MHz${color}
${execbar 4,344 ~/.config/conky/get_npu_val.sh BUSY}
${execgraph ~/.config/conky/npu_graph.sh 20,344 5af78e ff6e6e 100}
${color4}── GPU ─ Intel Arc ──────────────────────────────${color}
${color1}Freq: ${color2}${execi 3 ~/.config/conky/get_arc_val.sh FREQ_ACT} MHz${color}   ${color1}Potencia: ${color5}${execi 3 ~/.config/conky/get_arc_val.sh POWER} W${color}
${color1}Render: ${color2}${execi 3 ~/.config/conky/get_arc_val.sh RNDR}%${color}   ${color1}Compute: ${color2}${execi 3 ~/.config/conky/get_arc_val.sh COMPUTE}%${color}
${execbar 4,170 ~/.config/conky/get_arc_val.sh RNDR} ${execbar 4,170 ~/.config/conky/get_arc_val.sh COMPUTE}
${execgraph ~/.config/conky/arc_rndr.sh 20,170 5af78e ff6e6e 100} ${execgraph ~/.config/conky/arc_compute.sh 20,170 5af78e ff6e6e 100}
${color4}── HAILO-8L ─ AI Accelerator ────────────────────${color}
${color1}Estado: ${color2}${execi 3 ~/.config/conky/get_hailo_val.sh STATE}${color}   ${color1}Power: ${color5}${execi 3 ~/.config/conky/get_hailo_val.sh POWER}${color}
${color1}Dispositivo: ${color2}${execi 30 ~/.config/conky/get_hailo_val.sh SLOT}${color}  ${color1}FW: ${color2}${execi 3600 ~/.config/conky/get_hailo_val.sh FW}${color}
${color1}Serial: ${color2}${execi 3600 ~/.config/conky/get_hailo_val.sh SERIAL}${color}
${color1}Utilizacion: ${color2}${execi 5 ~/.config/conky/get_hailo_val.sh UTIL}%${color}
${execbar 4,344 ~/.config/conky/get_hailo_val.sh UTIL}
]];
