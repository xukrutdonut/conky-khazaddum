conky.config = {
    alignment = 'top_right',
    xinerama_head = 1,
    gap_x = 1450,
    gap_y = 10,
    minimum_width = 350,
    maximum_width = 350,
    update_interval = 3,

    -- Ventana
    own_window = true,
    own_window_type = 'desktop',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    double_buffer = true,

    -- Fuente
    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    override_utf8_locale = true,

    -- Colores
    default_color = 'e0e0e0',
    color1 = '5eb8ff',   -- azul: etiquetas
    color2 = '5af78e',   -- verde: bueno/TX
    color3 = 'ff6e6e',   -- rojo: alerta
    color4 = 'ffd700',   -- dorado: sección
    color5 = 'ffb347',   -- naranja: valores medios

    draw_shades = false,
    draw_outline = false,
    border_width = 0,
    no_buffers = true,
    short_units = true,
};

conky.text = [[
${color4}${alignc}KHAZAD-DUM${color}
${color1}${alignc}${nodename} — ${kernel}${color}
${color1}${alignc}Up: ${uptime_short}${color}
${hr 1}

${color4}── CPU ──────────────────────────────────────────${color}
${color1}Uso total: ${color2}${cpu cpu0}%${color}   ${color1}Freq: ${color2}${exec cat /sys/class/drm/card1/gt_cur_freq_mhz 2>/dev/null || echo 0} MHz${color}   ${color1}Temp: ${color3}${exec awk '{printf "%.0f°C",$1/1000}' /sys/class/hwmon/hwmon2/temp1_input 2>/dev/null || echo 0°C}${color}
${cpubar 5,344}
${cpugraph 25,344 5af78e ff6e6e}
${color1}Cores (1–4):${color}
${color2}${cpubar 4,80 cpu1}${color} ${color2}${cpubar 4,80 cpu2}${color} ${color2}${cpubar 4,80 cpu3}${color} ${color2}${cpubar 4,80 cpu4}${color}
 C1:${cpu cpu1}%   C2:${cpu cpu2}%   C3:${cpu cpu3}%   C4:${cpu cpu4}%
${color1}Cores (5–8):${color}
${color2}${cpubar 4,80 cpu5}${color} ${color2}${cpubar 4,80 cpu6}${color} ${color2}${cpubar 4,80 cpu7}${color} ${color2}${cpubar 4,80 cpu8}${color}
 C5:${cpu cpu5}%   C6:${cpu cpu6}%   C7:${cpu cpu7}%   C8:${cpu cpu8}%
${color1}Cores (9–12):${color}
${color2}${cpubar 4,80 cpu9}${color} ${color2}${cpubar 4,80 cpu10}${color} ${color2}${cpubar 4,80 cpu11}${color} ${color2}${cpubar 4,80 cpu12}${color}
 C9:${cpu cpu9}%  C10:${cpu cpu10}%  C11:${cpu cpu11}%  C12:${cpu cpu12}%
${color1}Cores (13–16):${color}
${color2}${cpubar 4,80 cpu13}${color} ${color2}${cpubar 4,80 cpu14}${color} ${color2}${cpubar 4,80 cpu15}${color} ${color2}${cpubar 4,80 cpu16}${color}
 C13:${cpu cpu13}%  C14:${cpu cpu14}%  C15:${cpu cpu15}%  C16:${cpu cpu16}%

${color4}── MEMORIA ──────────────────────────────────────${color}
${color1}RAM:  ${color2}${mem} / ${memmax}${color}  (${color5}${memperc}%${color})
${membar 5,344}
${color1}Swap: ${color5}${swap} / ${swapmax}${color}  (${color5}${swapperc}%${color})
${swapbar 4,344}

${color4}── ALMACENAMIENTO ───────────────────────────────${color}
${color1}nvme0n1: ${color2}${fs_used /} / ${fs_size /}${color}  (${color5}${fs_used_perc /}%${color})
${fs_bar 5,344 /}
${color1}Storage1TB: ${color2}${fs_used /media/arkantu/Storage1TB} / ${fs_size /media/arkantu/Storage1TB}${color}  (${color5}${fs_used_perc /media/arkantu/Storage1TB}%${color})
${fs_bar 5,344 /media/arkantu/Storage1TB}
${color1}NVMe temp: ${color3}${exec awk '{printf "%.0f°C",$1/1000}' /sys/class/hwmon/hwmon1/temp1_input 2>/dev/null || echo N/A}${color}

${color4}── DISCO I/O ─────────────────────────────────${color}
${color1}▼ R: ${color2}${diskio_read}${color}   ${color1}▲ W: ${color5}${diskio_write}${color}
${execgraph ~/.config/conky/khazad_diskioread.sh 25,170 5af78e ffb347} ${execgraph ~/.config/conky/khazad_diskiowrite.sh 25,170 ff6e6e ffb347}

${color4}── RED ─ enp173s0 ───────────────────────────────${color}
${color1}▼ RX: ${color2}${downspeed enp173s0}${color}   ${color1}▲ TX: ${color5}${upspeed enp173s0}${color}
${downspeedgraph enp173s0 25,170 5af78e ff6e6e} ${upspeedgraph enp173s0 25,170 5af78e ffb347}
${color1}Total: ▼${color2}${totaldown enp173s0}${color}  ▲${color5}${totalup enp173s0}${color}

${color4}── NPU ─ Intel AI Boost ─────────────────────────${color}
${color1}Uso: ${color2}${execi 3 ~/.config/conky/get_npu_val.sh BUSY}%${color}   ${color1}Freq: ${color2}${execi 3 ~/.config/conky/get_npu_val.sh FREQ} / ${execi 3 ~/.config/conky/get_npu_val.sh FREQ_MAX} MHz${color}
${execbar 5,344 ~/.config/conky/get_npu_val.sh BUSY}
${execgraph ~/.config/conky/npu_graph.sh 25,344 5af78e ff6e6e 100}

${color4}── GPU ─ Intel Arc ──────────────────────────────${color}
${color1}Freq: ${color2}${execi 3 ~/.config/conky/get_arc_val.sh FREQ_ACT} MHz${color}   ${color1}Potencia: ${color5}${execi 3 ~/.config/conky/get_arc_val.sh POWER} W${color}
${color1}Render:${color}
${execbar 5,344 ~/.config/conky/get_arc_val.sh RNDR}
${execgraph ~/.config/conky/arc_rndr.sh 25,344 5af78e ff6e6e 100}

${color4}── GPU ─ AMD Radeon RX 480 ──────────────────────${color}
${color1}VRAM: ${color2}${execi 3 ~/.config/conky/get_amdgpu_val.sh VRAM_USED_MB} MB / ${execi 3 ~/.config/conky/get_amdgpu_val.sh VRAM_TOTAL_MB} MB${color}  (${color5}${execi 3 ~/.config/conky/get_amdgpu_val.sh VRAM_PERC}%${color})
${execbar 5,344 ~/.config/conky/get_amdgpu_val.sh VRAM_PERC}
${execgraph ~/.config/conky/get_amdgpu_val.sh VRAM_PERC 25,344 5af78e ff6e6e 100}
]];
