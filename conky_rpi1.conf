conky.config = {
    alignment = 'top_right',
    xinerama_head = 1,
    gap_x = 1090,
    gap_y = 10,
    minimum_width = 350,
    maximum_width = 350,
    update_interval = 5,
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    double_buffer = true,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    override_utf8_locale = true,
    default_color = 'e0e0e0',
    color1 = '5eb8ff',
    color2 = '5af78e',
    color3 = 'ff6e6e',
    color4 = 'ffd700',
    color5 = 'ffb347',
    draw_shades = false,
    draw_outline = false,
    border_width = 0,
    no_buffers = true,
    short_units = true,
};

conky.text = [[
${color4}${alignc}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 HOST}${color}
${color1}${alignc}192.168.0.105 — ${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 KERNEL}${color}
${color1}${alignc}Up: ${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 UPTIME}${color}
${hr 1}

${color4}── CPU ──────────────────────────────────────────${color}
${color1}Uso: ${color2}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 CPU}%${color}   ${color1}Temp: ${color3}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 TEMP}°C${color}
${execbar 7,344 ~/.config/conky/get_rpi_val.sh 192.168.0.105 CPU}
${execgraph ~/.config/conky/rpi1_cpu.sh 45,344 5af78e ff6e6e}
${color1}Cores:${color}
${color2}${execbar 5,168 ~/.config/conky/get_rpi_val.sh 192.168.0.105 CPU0}${color} ${color2}${execbar 5,168 ~/.config/conky/get_rpi_val.sh 192.168.0.105 CPU1}${color}
 C0:${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 CPU0}%      C1:${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 CPU1}%
${color2}${execbar 5,168 ~/.config/conky/get_rpi_val.sh 192.168.0.105 CPU2}${color} ${color2}${execbar 5,168 ~/.config/conky/get_rpi_val.sh 192.168.0.105 CPU3}${color}
 C2:${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 CPU2}%      C3:${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 CPU3}%

${color4}── MEMORIA ──────────────────────────────────────${color}
${color1}RAM: ${color2}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 RAMUSED_H} / ${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 RAMTOTAL_H}${color}  (${color5}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 RAMPCT}%${color})
${execbar 7,344 ~/.config/conky/get_rpi_val.sh 192.168.0.105 RAMPCT}


${color4}── ALMACENAMIENTO ───────────────────────────────${color}
${color1}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK0_NAME}: ${color2}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK0_USED_H} / ${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK0_TOTAL_H}${color}  (${color5}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK0_PCT}%${color})
${execbar 7,344 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK0_PCT}
${color1}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK1_NAME}: ${color2}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK1_USED_H} / ${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK1_TOTAL_H}${color}  (${color5}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK1_PCT}%${color})
${execbar 7,344 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK1_PCT}
${color1}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK2_NAME}: ${color2}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK2_USED_H} / ${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK2_TOTAL_H}${color}  (${color5}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK2_PCT}%${color})
${execbar 7,344 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISK2_PCT}

${color4}── DISCO I/O ─────────────────────────────────${color}
${color1}▼ R: ${color2}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISKIO_READ_H}${color}   ${color1}▲ W: ${color5}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 DISKIO_WRITE_H}${color}
${execgraph ~/.config/conky/rpi1_diskioread.sh 40,170 5af78e ffb347} ${execgraph ~/.config/conky/rpi1_diskiowrite.sh 40,170 ff6e6e ffb347}

${color4}── RED ──────────────────────────────────────────${color}
${color1}▼ RX: ${color2}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 RXBPS_H}${color}   ${color1}▲ TX: ${color5}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.105 TXBPS_H}${color}
${execgraph ~/.config/conky/rpi1_rx.sh 40,170 5af78e ffb347} ${execgraph ~/.config/conky/rpi1_tx.sh 40,170 5af78e ffb347}
]];
