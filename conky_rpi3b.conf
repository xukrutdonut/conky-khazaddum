conky.config = {
    alignment = 'top_right',
    xinerama_head = 1,
    gap_x = 10,
    gap_y = 10,
    minimum_width = 350,
    maximum_width = 350,
    update_interval = 5,
    own_window = true,
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    double_buffer = true,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    override_utf8_locale = true,
    default_color = 'e0e0e0',
    color1 = '5eb8ff',   -- azul
    color2 = '5af78e',   -- verde
    color3 = 'ff6e6e',   -- rojo
    color4 = 'ffd700',   -- dorado
    color5 = 'ffb347',   -- naranja
    draw_shades = false,
    draw_outline = false,
    border_width = 0,
    no_buffers = true,
    short_units = true,
};

conky.text = [[
${color4}${alignc}rpi3b-cluster${color}
${color1}${alignc}192.168.0.101..221 — Linux${color}
${color1}${alignc}Up: Active${color}
${hr 1}

${color4}── RPi 3B #1 (192.168.0.101) ───────────────────${color}
${color1}CPU: ${color2}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.101 CPU}%${color} ${color1}Temp: ${color3}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.101 TEMP}°C${color} ${color1}RAM: ${color2}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.101 RAMUSED_H}/${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.101 RAMTOTAL_H}${color} (${color5}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.101 RAMPCT}%${color})
${color1}SD/Disco: ${color2}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.101 DISK0_USED_H} / ${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.101 DISK0_TOTAL_H}${color} (${color5}${execi 30 ~/.config/conky/get_rpi_val.sh 192.168.0.101 DISK0_PCT}%${color})
